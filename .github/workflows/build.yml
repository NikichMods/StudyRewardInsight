name: Build

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feature/**'
      - 'fix/**'
      - 'research/**'
    paths:
      - 'src/**'
      - 'StudyRewardInsight.csproj'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'StudyRewardInsight.csproj'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore StudyRewardInsight.csproj

      - name: Build
        run: dotnet build StudyRewardInsight.csproj -c Release --no-restore --nologo
