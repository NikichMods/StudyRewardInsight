name: Build

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feature/**'
      - 'fix/**'
      - 'research/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'StudyRewardInsight.csproj'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'StudyRewardInsight.csproj'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify source identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "source_sha=$actual"
          if ($actual -ne "${{ github.sha }}") {
            throw "Checkout SHA mismatch: expected ${{ github.sha }}, got $actual"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore production
        run: dotnet restore StudyRewardInsight.csproj

      - name: Restore reward-model tests
        run: dotnet restore tests/RewardModelTests/RewardModelTests.csproj

      - name: Build production
        run: dotnet build StudyRewardInsight.csproj -c Release --no-restore --nologo

      - name: Run reward-model tests
        run: dotnet run --project tests/RewardModelTests/RewardModelTests.csproj -c Release --no-restore

      - name: Prepare development artifact
        if: startsWith(github.ref, 'refs/heads/dev/') || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/')
        shell: pwsh
        run: |
          $dll = Resolve-Path 'bin/Release/StudyRewardInsight.dll'
          $out = Join-Path $PWD 'artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll (Join-Path $out 'StudyRewardInsight.dll')
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "candidate_version=0.2.0"
            "source_sha=${{ github.sha }}"
            "sha256=$hash"
            "target=GraveyardKeeper-1.407"
            "artifact=StudyRewardInsight.dll"
            "scope=all supported languages incomplete-Study tooltip preview"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'BUILD_IDENTITY.txt')
          Get-Content (Join-Path $out 'BUILD_IDENTITY.txt')

      - name: Upload development artifact
        if: startsWith(github.ref, 'refs/heads/dev/') || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/')
        uses: actions/upload-artifact@v4
        with:
          name: StudyRewardInsight-0.2.0-${{ github.sha }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
